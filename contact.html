        <div class="contact-container reveal delay-2">
            <form class="contact-form" id="contactForm" onsubmit="handleSubmit(event)">

                    <input type="text" placeholder="Full Name" required>
                    <input type="email" placeholder="Email Address" required>
                </div>
                <div class="input-box">
                    <input type="text" placeholder="Mobile Number">
                    <input type="text" placeholder="Subject">
                </div>
                <textarea cols="30" rows="8" placeholder="Your Message" required></textarea>
                <button type="submit" class="btn">Send Message <i class='bx bx-send'></i></button>
            </form>
        </div>
    </section>
